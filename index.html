<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your experience at Coiffure Mina</title>
<meta name="description" content="Share your experience at Coiffure Mina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- AS Media · testimonial formulier Mina (Web3Forms, antwoorden komen per mail) -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8628F;--pink-d:#C93C6E;--pink-l:#FDF1F5;--pink-m:#F8D3E0;--ink:#2B1F24;--muted:#7C6A72;--line:#F1DDE6}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Montserrat,system-ui,sans-serif;font-weight:500;color:var(--ink);background:#fff;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:24px 20px 150px;min-height:100%}
  .logo{width:112px;height:112px;border-radius:50%;background:#F9D9DF;overflow:hidden;margin:0 auto 24px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
  .logo img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;display:block}
  .mono{position:relative;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:#111;line-height:1;height:44px;width:58px}
  .mono .c{position:absolute;left:4px;top:-4px;font-size:40px}
  .mono .m{position:absolute;left:16px;top:6px;font-size:40px}
  .lname{font-family:'Cormorant Garamond',Georgia,serif;font-size:7.5px;letter-spacing:2px;color:#111;margin-top:4px}
  .brand{font-weight:800;font-size:14px;letter-spacing:3px;color:var(--pink-d);text-transform:uppercase;margin-bottom:22px}
  .step{display:none;animation:in .35s ease}
  .step.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .kick{display:inline-block;background:var(--pink-l);border:1.5px solid var(--pink-m);color:var(--pink-d);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px;margin-bottom:14px}
  h1{font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:800;letter-spacing:-.6px}
  h1 em{font-style:normal;color:var(--pink-d)}
  .lead{color:var(--muted);margin:0 0 22px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 6px 20px rgba(201,60,110,.05)}
  label.t{display:block;font-weight:700;margin:0 0 7px}
  label.t small{font-weight:500;color:var(--muted)}
  .f{margin-bottom:16px}
  input[type=text],textarea{width:100%;font:inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--pink)}
  textarea{min-height:120px;resize:vertical}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:15px;background:#fff;transition:border-color .15s,background .15s}
  .opt:has(input:checked){border-color:var(--pink);background:var(--pink-l)}
  .opt input{accent-color:var(--pink-d);width:18px;height:18px;flex:none}
  .stack{grid-template-columns:1fr}
  .more{display:none;margin-top:12px}
  .more.on{display:block;animation:in .25s ease}
  .more label{font-size:14px}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
  .nav{display:flex;gap:10px;margin-top:18px}
  .back{border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;padding:14px 18px;border-radius:999px;cursor:pointer}
  .next{flex:1;border:0;background:var(--pink-d);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:15px;border-radius:999px;cursor:pointer}
  .next:disabled{opacity:.7}
  .err{color:#B3261E;font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);padding:12px 20px 16px}
  .bar .in{max-width:640px;margin:0 auto}
  .msg{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--pink-d);margin-bottom:8px}
  .track{position:relative;height:50px;border-radius:999px;background:var(--pink-l);border:1.5px solid var(--line);overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(100deg,var(--pink),var(--pink-d));transition:width .5s ease;overflow:hidden;z-index:2}
  .fill b{position:absolute;inset:0 auto 0 0;display:grid;place-content:center;color:#fff;font-weight:800;white-space:nowrap}
  .track span{position:absolute;inset:0;display:grid;place-content:center;font-weight:800;color:var(--ink)}
  .thanks{text-align:left;padding:10px 0}
  .thanks h1{font-size:32px}
  .heart{display:grid;place-content:center;width:64px;height:64px;border-radius:50%;background:var(--pink-l);border:1.5px solid var(--pink-m);font-size:30px;margin-bottom:16px}
  .opt-s{font-size:15px;font-weight:600;color:var(--muted)}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ph{position:relative;display:grid;place-items:center;aspect-ratio:3/4;border:1.5px dashed var(--pink-m);border-radius:16px;background:var(--pink-l);cursor:pointer;overflow:hidden}
  .ph input{position:absolute;opacity:0;width:1px;height:1px}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .ph.has img{display:block}
  .pt{position:absolute;top:10px;left:10px;z-index:2;background:#fff;color:var(--pink-d);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
  .pc{font-weight:700;color:var(--pink-d)}
  .ph.has .pc{display:none}
  .lang{display:flex;justify-content:center;gap:6px;margin:-8px 0 22px}
  .lang button{font:inherit;font-size:12px;font-weight:700;letter-spacing:1px;border:1.5px solid var(--line);background:#fff;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
  .lang button.on{border-color:var(--pink-d);color:var(--pink-d);background:var(--pink-l)}
  input[type=email],input[type=tel]{width:100%;font:inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  @media (max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png" alt="Coiffure Mina"></div>
  <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="nl">NL</button><button data-l="fr">FR</button></div>
  <form id="f" novalidate>
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="steps"></div>
    <div class="err" id="err"></div>
    <div class="nav" id="nav">
      <button type="button" class="back" id="back"></button>
      <button type="button" class="next" id="next"></button>
    </div>
  </form>
  <div class="thanks step" id="thanks"><div class="heart">💗</div><h1 id="tyH"></h1><p class="lead" id="tyP"></p></div>
</div>
<div class="bar"><div class="in">
  <div class="msg"><span id="msg"></span><span id="cnt"></span></div>
  <div class="track" id="track"><span id="barTxt"></span><div class="fill" id="fill"><b id="barTxt2"></b></div></div>
</div></div>
<script>
const WEB3FORMS_KEY='7bff82df-9018-4cff-828f-3795eb3922d1';
const T={
 en:{back:'Back',next:'Next',send:'Send my experience',sending:'Sending…',other:'Other',otherQ:'Tell us which',opt:'(optional)',
  errFill:'Please fill this in to continue.',errPick:'Pick at least one option.',errOther:'Please tell us which under Other.',errMail:'Please enter a valid email.',errFail:'Something went wrong, please try again.',
  name:'Your name',email:'Email',phone:'Phone number',ig:'Instagram',pBefore:'Before',pAfter:'After',pPick:'Choose photo',
  tyH:'Thank you!',tyP:'Your experience has been sent to Coiffure Mina.',
  msgs:["Let's start","Nice, keep going","You're doing great","Halfway there","Love this","Almost there","Almost there","So close","Last bits","Final step"],done:'Sent ✓'},
 nl:{back:'Terug',next:'Volgende',send:'Verstuur mijn ervaring',sending:'Versturen…',other:'Andere',otherQ:'Vertel welke',opt:'(optioneel)',
  errFill:'Vul dit nog even in om verder te gaan.',errPick:'Kies minstens één optie.',errOther:'Vul bij Andere nog even in welke.',errMail:'Vul een geldig e-mailadres in.',errFail:'Er ging iets mis, probeer het nog eens.',
  name:'Je naam',email:'E-mail',phone:'Telefoonnummer',ig:'Instagram',pBefore:'Voor',pAfter:'Na',pPick:'Kies foto',
  tyH:'Dankjewel!',tyP:'Je ervaring is verstuurd naar Coiffure Mina.',
  msgs:['We beginnen','Goed bezig','Je doet het super','Halverwege','Mooi zo','Bijna klaar','Bijna klaar','Nog heel even','Laatste stukjes','Laatste stap'],done:'Verstuurd ✓'},
 fr:{back:'Retour',next:'Suivant',send:'Envoyer mon expérience',sending:'Envoi…',other:'Autre',otherQ:'Dites-nous lequel',opt:'(facultatif)',
  errFill:'Merci de remplir ce champ pour continuer.',errPick:'Choisissez au moins une option.',errOther:'Précisez votre choix sous Autre.',errMail:'Merci d’entrer un e-mail valide.',errFail:'Une erreur est survenue, réessayez.',
  name:'Votre nom',email:'E-mail',phone:'Numéro de téléphone',ig:'Instagram',pBefore:'Avant',pAfter:'Après',pPick:'Choisir une photo',
  tyH:'Merci !',tyP:'Votre expérience a été envoyée à Coiffure Mina.',
  msgs:['On commence','Super, continuez','Vous êtes géniale','À mi-chemin','J’adore','Presque fini','Presque fini','Encore un peu','Dernières questions','Dernière étape'],done:'Envoyé ✓'}
};
// q: [field, multi?, {en,nl,fr} question, [[en,nl,fr],...], other?]
const Q=[
 ['Behandeling',1,{en:'Which treatment did you have?',nl:'Welke behandeling heb je gehad?',fr:'Quel soin avez-vous reçu ?'},[['Sew-in extensions (leave-out)','Sew-in extensions (leave-out)','Extensions cousues (leave-out)'],['Ponytail','Ponytail','Ponytail'],['Raw Indian hair (CM Xtensions)','Raw Indian hair (CM Xtensions)','Cheveux indiens bruts (CM Xtensions)'],['Trim / extra care','Trim / extra verzorging','Coupe / soin en plus']],1],
 ['Haar ervoor',1,{en:'How was your hair before you came?',nl:'Hoe was je haar voor je kwam?',fr:'Comment étaient vos cheveux avant ?'},[['Dry or damaged','Droog of beschadigd','Secs ou abîmés'],['Thin or broken edges','Dun of afgebroken randen','Fins ou contours cassés'],['Hard to maintain','Moeilijk te onderhouden','Difficiles à entretenir'],['No style that suited me','Geen stijl die bij me paste','Aucun style qui me convenait'],['Bad experience elsewhere','Slechte ervaring bij een andere kapper','Mauvaise expérience ailleurs']],1],
 ['Gevoel ervoor',1,{en:'How did you feel back then?',nl:'Hoe voelde je je toen?',fr:'Comment vous sentiez-vous ?'},[['Insecure','Onzeker','Pas sûre de moi'],['Frustrated','Gefrustreerd','Frustrée'],['Afraid of damaging my hair','Bang voor schade aan mijn haar','Peur d’abîmer mes cheveux'],["I didn't know who to trust",'Ik wist niet bij wie ik terecht kon','Je ne savais pas à qui faire confiance']],1],
 ['Waarom gekozen',1,{en:'Why did you choose Coiffure Mina?',nl:'Waarom koos je voor Coiffure Mina?',fr:'Pourquoi avoir choisi Coiffure Mina ?'},[['Her work on Instagram','Haar werk op Instagram','Son travail sur Instagram'],['Someone recommended her','Iemand raadde haar aan','On me l’a recommandée'],['Specialised in curly hair','Gespecialiseerd in krullend haar','Spécialisée cheveux bouclés'],['Good reviews','Goede reviews','Bons avis']],1],
 ['Gevoel nu',1,{en:'How do you feel now?',nl:'Hoe voel je je nu?',fr:'Comment vous sentez-vous maintenant ?'},[['Confident','Zelfverzekerd','Confiante'],['Beautiful','Mooi','Belle'],['My hair feels healthy','Mijn haar voelt gezond','Mes cheveux sont en bonne santé'],['I get compliments','Ik krijg complimenten','Je reçois des compliments'],['Easy to maintain','Makkelijk te onderhouden','Facile à entretenir']],1],
 ['Het beste',1,{en:'What did you love most?',nl:'Wat vond je het beste?',fr:'Qu’avez-vous préféré ?'},[['The result','Het resultaat','Le résultat'],['How she listened','Hoe ze luisterde','Son écoute'],['How comfortable it was','Hoe comfortabel het zat','Le confort'],['How neat the work is','Hoe netjes het werk is','La finition'],['The vibe in the salon','De sfeer in de salon','L’ambiance du salon']],1],
 ['Ervaring salon',1,{en:'How was the salon experience?',nl:'Hoe was het in de salon?',fr:'Comment était l’expérience au salon ?'},[['Booking was easy','Boeken ging vlot','Réservation facile'],['I felt welcome','Ik voelde me welkom','Je me suis sentie bienvenue'],['She kept me updated','Ze hield me op de hoogte','Elle m’a tenue informée'],['Everything was on time','Alles was op tijd','Tout était à l’heure']],1],
 ['Aanraden',0,{en:'Would you recommend Coiffure Mina?',nl:'Zou je Coiffure Mina aanraden?',fr:'Recommanderiez-vous Coiffure Mina ?'},[['Yes','Ja','Oui'],['Maybe','Misschien','Peut-être'],['No','Nee','Non']],0],
 ['PHOTOS'],
 ['Toestemming',0,{en:'Can we share your answer?',nl:'Mogen we je antwoord delen?',fr:'Pouvons-nous partager votre réponse ?'},[['Yes, with my name','Ja, met mijn naam','Oui, avec mon nom'],['Yes, anonymously','Ja, anoniem','Oui, anonymement'],['No, rather not','Nee, liever niet','Non, je préfère pas']],0]
];
const LI={en:0,nl:1,fr:2};
let L=(()=>{try{const s=localStorage.getItem('cm-lang');if(s&&T[s])return s}catch(e){} return 'en'})();
const $=id=>document.getElementById(id);
const state={}; const photos={}; let cur=0, steps=[];
function save(){ if(!steps.length)return; steps.forEach(s=>s.querySelectorAll('input').forEach(i=>{ if(i.type==='checkbox'||i.type==='radio'){ if(i.checked) (state[i.name]=state[i.name]||new Set()).add(i.dataset.v); else state[i.name]&&state[i.name].delete(i.dataset.v);} else if(i.type!=='file') state[i.name]=i.value; })); }
function build(){
  save(); const t=T[L], li=LI[L]; let h='';
  h+=`<section class="step"><h1>${{en:'How was your experience at <em>Coiffure Mina</em>?',nl:'Hoe was jouw ervaring bij <em>Coiffure Mina</em>?',fr:'Comment s’est passée votre expérience chez <em>Coiffure Mina</em> ?'}[L]}</h1><div class="card">
   <div class="f"><label class="t">${t.name}</label><input type="text" name="Naam" required autocomplete="name"></div>
   <div class="f"><label class="t">${t.email}</label><input type="email" name="Email" required autocomplete="email"></div>
   <div class="f"><label class="t">${t.phone}</label><input type="tel" name="Telefoon" required autocomplete="tel"></div>
   <div class="f"><label class="t">${t.ig} <small>${t.opt}</small></label><input type="text" name="Instagram" placeholder="@" autocomplete="off"></div></div></section>`;
  for(const q of Q){
    if(q[0]==='PHOTOS'){ h+=`<section class="step"><h1>${{en:'Add a photo of your hair?',nl:'Wil je een foto van je haar toevoegen?',fr:'Ajouter une photo de vos cheveux ?'}[L]} <small class="opt-s">${t.opt}</small></h1><div class="card"><div class="photos">
      <label class="ph" data-ph="Foto voor"><input type="file" accept="image/*"><span class="pt">${t.pBefore}</span><img alt=""><span class="pc">${t.pPick}</span></label>
      <label class="ph" data-ph="Foto na"><input type="file" accept="image/*"><span class="pt">${t.pAfter}</span><img alt=""><span class="pc">${t.pPick}</span></label></div></div></section>`; continue; }
    const [name,multi,qq,opts,other]=q, type=multi?'checkbox':'radio';
    let o=opts.map(a=>`<label class="opt"><input type="${type}" name="${name}" data-v="${a[0]}">${a[li]}</label>`).join('');
    if(other) o+=`<label class="opt"><input type="${type}" name="${name}" data-v="Other" data-more>${t.other}</label>`;
    h+=`<section class="step"><h1>${qq[L]}</h1><div class="card"><div class="opts${multi?'':' stack'}" data-req="1">${o}</div>${other?`<div class="more"><label class="t">${t.otherQ}</label><input type="text" name="${name} (other)"></div>`:''}</div></section>`;
  }
  $('steps').innerHTML=h; steps=[...$('steps').querySelectorAll('.step')];
  steps.forEach(s=>s.querySelectorAll('input').forEach(i=>{ if(i.type==='checkbox'||i.type==='radio'){ if(state[i.name]&&state[i.name].has(i.dataset.v)) i.checked=true; } else if(i.type!=='file'&&state[i.name]) i.value=state[i.name]; }));
  steps.forEach(s=>s.querySelectorAll('.opts').forEach(g=>{ const sync=()=>{ const m=g.nextElementSibling, o=g.querySelector('[data-more]'); if(m&&o) m.classList.toggle('on',o.checked); }; g.addEventListener('change',()=>{ sync(); const o=g.querySelector('[data-more]'); if(o&&o.checked) g.nextElementSibling.querySelector('input').focus(); }); sync(); }));
  document.querySelectorAll('.ph').forEach(l=>{ const k=l.dataset.ph; if(photos[k]){ l.querySelector('img').src=photos[k]; l.classList.add('has'); }
    l.querySelector('input').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const img=new Image(), u=URL.createObjectURL(f);
      img.onload=()=>{ const r=Math.min(1,1000/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); photos[k]=c.toDataURL('image/jpeg',0.75); l.querySelector('img').src=photos[k]; l.classList.add('has'); URL.revokeObjectURL(u); }; img.src=u; }); });
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  document.documentElement.lang=L; $('back').textContent=t.back; $('tyH').textContent=t.tyH; $('tyP').textContent=t.tyP;
  show(cur);
}
function valid(i){ const t=T[L], s=steps[i];
  for(const el of s.querySelectorAll('input[required]')){ if(!el.value.trim()){ el.focus(); return t.errFill; } if(el.type==='email'&&!/^\S+@\S+\.\S+$/.test(el.value.trim())){ el.focus(); return t.errMail; } }
  for(const g of s.querySelectorAll('[data-req]')){ if(!g.querySelector('input:checked')) return t.errPick; const o=g.querySelector('[data-more]:checked'); if(o){ const m=g.nextElementSibling.querySelector('input'); if(!m.value.trim()){ m.focus(); return t.errOther; } } }
  return ''; }
function show(i){ const t=T[L]; cur=i; steps.forEach((s,k)=>s.classList.toggle('on',k===i));
  $('back').style.visibility=i?'visible':'hidden'; $('next').textContent=i===steps.length-1?t.send:t.next;
  $('msg').textContent=t.msgs[Math.min(i,t.msgs.length-1)]; $('cnt').textContent=(i+1)+' / '+steps.length;
  const p=Math.round(i/steps.length*100); $('fill').style.width=p+'%';
  $('barTxt').textContent=$('barTxt2').textContent=i===steps.length-1?t.msgs[t.msgs.length-1]+' 💕':p+'% · '+t.msgs[Math.min(i,t.msgs.length-1)];
  $('barTxt2').style.width=$('track').clientWidth+'px'; $('err').textContent=''; }
$('back').onclick=()=>{ show(Math.max(0,cur-1)); window.scrollTo({top:0,behavior:'smooth'}); };
$('next').onclick=async()=>{ const e=valid(cur); if(e){$('err').textContent=e;return;} if(cur<steps.length-1){ show(cur+1); window.scrollTo({top:0,behavior:'smooth'}); return; } await send(); };
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{ L=b.dataset.l; try{localStorage.setItem('cm-lang',L)}catch(e){} build(); });
async function send(){ const t=T[L], btn=$('next'); btn.disabled=true; btn.textContent=t.sending; $('fill').style.width='92%'; save();
  const out=new FormData(); out.append('access_key',WEB3FORMS_KEY); out.append('subject','Nieuwe testimonial - Coiffure Mina'); out.append('from_name','Mina testimonials');
  out.append('Taal',L.toUpperCase()); out.append('botcheck',$('f').querySelector('[name=botcheck]').checked?'1':'');
  for(const k of ['Naam','Email','Telefoon','Instagram']) if(state[k]&&state[k].trim()) out.append(k,state[k].trim());
  for(const q of Q){ if(q[0]==='PHOTOS')continue; const n=q[0]; const v=state[n]?[...state[n]]:[]; if(v.length) out.append(n,v.join(', ')); const o=state[n+' (other)']; if(v.includes('Other')&&o&&o.trim()) out.append(n+' (andere)',o.trim()); }
  for(const k in photos) out.append(k,photos[k]);
  try{ const r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:out,headers:{Accept:'application/json'}}); const j=await r.json(); if(!j.success) throw 0;
    $('fill').style.width='100%'; $('barTxt').textContent=$('barTxt2').textContent=t.done; $('msg').textContent=t.tyH; $('f').style.display='none'; $('thanks').classList.add('on'); window.scrollTo(0,0);
  }catch(_){ btn.disabled=false; btn.textContent=t.send; $('err').textContent=t.errFail; } }
cur=Math.max(0,+(new URLSearchParams(location.search).get('step')||0)); build(); cur=Math.min(cur,steps.length-1); show(cur);
</script>
</body>
</html>
